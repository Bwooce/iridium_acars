name: Host tests

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  host-tests:
    runs-on: ubuntu-24.04
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get install -y cmake gcc

      - name: Configure
        # Debug (NOT Release): host tests are assert-based, so NDEBUG (Release)
        # compiles the asserts out — making the tests pass VACUOUSLY and turning
        # every assert-only variable into an -Werror unused-variable failure.
        # Debug keeps asserts live (the actual checks) and matches the local
        # `build-dbg` flow. See the "host tests need Debug build" project note.
        run: cmake -B tests/host/build -S tests/host -DCMAKE_BUILD_TYPE=Debug

      - name: Build
        run: cmake --build tests/host/build --parallel

      - name: Run tests
        run: ctest --test-dir tests/host/build --output-on-failure
