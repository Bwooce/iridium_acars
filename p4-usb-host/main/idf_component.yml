## IDF Component Manager Manifest File
dependencies:
  ## Required IDF version
  idf:
    version: '>=4.1.0'
  # # Put list of dependencies here
  # # For components maintained by Espressif:
  # component: "~1.0.0"
  # # For 3rd party components:
  # username/component: ">=1.0.0,<2.0.0"
  # username2/component2:
  #   version: "~1.0.0"
  #   # For transient dependencies `public` flag can be set.
  #   # `public` flag doesn't have an effect dependencies of the `main` component.
  #   # All dependencies of `main` are public by default.
  #   public: true
  espressif/usb: '*'
  espressif/esp-dsp: '>=1.5.1'
  # D17 / Wi-Fi: P4 has no native Wi-Fi. Use esp_wifi_remote to route
  # all esp_wifi_* calls over SDIO RPC to the C6 running the factory
  # esp_hosted slave firmware. From the P4's source perspective, the
  # standard esp_wifi API is available. See memory note
  # project_p4_c6_pinout.md for why this is the only viable transport
  # on the Waveshare P4-NANO (no inter-chip UART wires).
  espressif/esp_wifi_remote:
    version: ">=1.3.1,<2.0"
    rules:
      - if: "target in [esp32p4, esp32h2]"
  espressif/esp_hosted:
    # >=2.12.10: fixes the SDIO RX heap corruption that corrupts large downloads
    # (OTA verify-fail). Our SDIO transport checksum + lwip IP/UDP checks are both
    # off (offload-assumed), so nothing else catches an RX-buffer byte error.
    version: ">=2.12.10"
    rules:
      - if: "target in [esp32p4, esp32h2]"
